services:
  postgres:
    image: postgres:16
    container_name: orderflow_postgres
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow123
      POSTGRES_DB: orderflow_dw
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow_dw"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: